name: Build OTC Analyzer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-33 build-tools;33.0.2"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.33

      - name: Point buildozer to installed SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"
          ln -s "$ANDROID_HOME" "$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/tools"
          ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$HOME/.buildozer/android/platform/android-sdk/tools/bin"

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OTC-Analyzer-APK
          path: bin/*.apk
